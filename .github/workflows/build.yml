name: Build Windows app

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build installer
        run: npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Read app version
        id: ver
        shell: bash
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Keep a copy as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Claude-Multi-Windows
          path: |
            dist/*.exe

      - name: Publish a download link (GitHub Release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: Multi AI ${{ steps.ver.outputs.v }}
          body: Download the file named Setup, run it, and click More info then Run anyway if Windows asks.
          files: dist/*.exe
